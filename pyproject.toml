[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosound-eval"
version = "0.1.0"
description = "Recording-aware research evaluation pipeline for EcoSound AI"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
baseline = ["scipy>=1.10", "scikit-learn>=1.3", "soundfile>=0.12"]
birdnet = ["birdnet-analyzer>=2.4"]
audio = ["soundfile>=0.12"]
dev = ["pytest>=7"]
web = ["streamlit>=1.40", "pandas>=2.0"]

[project.scripts]
ecosound-eval = "ecosound_eval.pipeline:main"

[tool.setuptools.packages.find]
include = ["ecosound_eval*"]
